{
  "context.properties": {
    "log.level": 2
  },
  "context.spa-libs": {
    "audio.convert.*": "audioconvert/libspa-audioconvert",
    "support.*": "support/libspa-support"
  },
  "context.modules": [
    {
      "name": "libpipewire-module-rt",
      "flags": [
        "ifexists",
        "nofail"
      ]
    },
    {
      "name": "libpipewire-module-protocol-native"
    },
    {
      "name": "libpipewire-module-client-node"
    },
    {
      "name": "libpipewire-module-adapter"
    },
    {
      "name": "libpipewire-module-filter-chain",
      "args": {
        "node.description": "Fieldstation Bass + Limiter",
        "audio.channels": 2,
        "audio.position": [
          "FL",
          "FR"
        ],
        "filter.graph": {
          "nodes": [
            {
              "type": "builtin",
              "name": "preL",
              "label": "bq_highshelf",
              "control": {
                "Freq": 0,
                "Q": 0.707,
                "Gain": -7
              }
            },
            {
              "type": "builtin",
              "name": "hpL",
              "label": "bq_highpass",
              "control": {
                "Freq": 70,
                "Q": 0.707
              }
            },
            {
              "type": "builtin",
              "name": "bassL",
              "label": "bq_peaking",
              "control": {
                "Freq": 120,
                "Q": 0.8,
                "Gain": 0
              }
            },
            {
              "type": "builtin",
              "name": "preR",
              "label": "bq_highshelf",
              "control": {
                "Freq": 0,
                "Q": 0.707,
                "Gain": -7
              }
            },
            {
              "type": "builtin",
              "name": "hpR",
              "label": "bq_highpass",
              "control": {
                "Freq": 70,
                "Q": 0.707
              }
            },
            {
              "type": "builtin",
              "name": "bassR",
              "label": "bq_peaking",
              "control": {
                "Freq": 120,
                "Q": 0.8,
                "Gain": 0
              }
            },
            {
              "type": "ladspa",
              "name": "limit",
              "plugin": "/home/markt1600/.local/opt/fieldstation-audio/usr/lib/ladspa/fast_lookahead_limiter_1913.so",
              "label": "fastLookaheadLimiter",
              "control": {
                "Input gain (dB)": 0,
                "Limit (dB)": -1,
                "Release time (s)": 0.15
              }
            }
          ],
          "links": [
            {
              "output": "preL:Out",
              "input": "hpL:In"
            },
            {
              "output": "hpL:Out",
              "input": "bassL:In"
            },
            {
              "output": "bassL:Out",
              "input": "limit:Input 1"
            },
            {
              "output": "preR:Out",
              "input": "hpR:In"
            },
            {
              "output": "hpR:Out",
              "input": "bassR:In"
            },
            {
              "output": "bassR:Out",
              "input": "limit:Input 2"
            }
          ],
          "inputs": [
            "preL:In",
            "preR:In"
          ],
          "outputs": [
            "limit:Output 1",
            "limit:Output 2"
          ]
        },
        "capture.props": {
          "node.name": "fieldstation_dsp",
          "media.class": "Audio/Sink",
          "priority.session": 2000
        },
        "playback.props": {
          "node.name": "fieldstation_dsp_output",
          "node.passive": true,
          "target.object": "alsa_output.platform-soc_107c000000_sound.stereo-fallback",
          "node.dont-fallback": true,
          "node.dont-move": true
        }
      }
    }
  ]
}